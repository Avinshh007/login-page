<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login & Register</title>

    <!-- TAILWIND CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <style>

        *{
            font-family:'Poppins',sans-serif;
        }

    </style>

</head>

<body class="min-h-screen flex justify-center items-center bg-gradient-to-r from-white-500 to-white-300 p-5">

    <!-- LOGIN SECTION -->

    <div id="loginSection"
    class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">

        <!-- LEFT SIDE -->

        <div class="relative">

            <img src="campus.png"
            class="w-full h-full object-cover">

            <div class="absolute inset-0 bg-black/40 flex flex-col justify-center items-center text-center px-10">

                <h1 class="text-5xl font-bold text-white mb-6">

                    Welcome Back

                </h1>

                <p class="text-gray-200 text-lg leading-8">

                    Login and access your account

                </p>

            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="p-10 md:p-14">

            <h2 class="text-5xl font-bold text-gray-800 mb-3">

                Login

            </h2>

            <p class="text-gray-500 mb-10">

                Enter your login details

            </p>

            <!-- LOGIN FORM -->

            <form class="space-y-6">

                <!-- EMAIL -->

                <input type="email"
                placeholder="Email" oninput="this.value = this.value.replace(/[^a-zA-Z0-9@.]/g,'')"
                class="w-full h-14 px-5 border border-gray-300 rounded-xl outline-none focus:border-purple-500 transition">

                <!-- PASSWORD -->

                <input type="password"
                placeholder="Password"
                class="w-full h-14 px-5 border border-gray-300 rounded-xl outline-none focus:border-purple-500 transition">

                <!-- LOGIN BUTTON -->

                <button type="submit"
                class="w-full h-14 bg-purple-500 text-white rounded-xl font-semibold hover:bg-purple-700 transition duration-300" href="https://aditya.ac.in/jrcollege/">

                    Login

                </button>

            </form>

            <!-- REGISTER OPTION -->

            <p class="text-center text-gray-600 mt-8">

                Don’t have an account?

                <button onclick="showRegister()"
                class="text-purple-600 font-semibold hover:underline">

                    Register

                </button>

            </p>

        </div>

    </div>

    <!-- REGISTER SECTION -->

    <div id="registerSection"
    class="hidden w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">

        <!-- LEFT SIDE -->

        <div class="relative">

            <img src="campus.png"
            class="w-full h-full object-cover">

            <div class="absolute inset-0 bg-black/40 flex flex-col justify-center items-center text-center px-10">

                <h1 class="text-5xl font-bold text-white mb-6">

                    Welcome

                </h1>

                <p class="text-gray-200 text-lg leading-8">

                    welcome to Aditya education institutes kindly register.

                </p>

            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="p-10 md:p-14">

            <h2 class="text-5xl font-bold text-gray-800 mb-3">

                Register

            </h2>

            <p class="text-gray-500 mb-10">

                Create your account. It’s free and only takes a minute

            </p>

            <!-- REGISTER FORM -->

           <form class="space-y-6"
onsubmit="validateRegister(event)">
               <!-- NAME -->

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <div>

        <input type="text"
        id="firstName"
        placeholder="First Name"oninput="this.value = this.value.replace(/[^a-zA-Z]/g,'')"
        class="w-full h-14 px-5 border border-gray-300 rounded-xl outline-none focus:border-purple-500 transition">

        <small id="firstNameError"
        class="text-red-500 text-sm"></small>

    </div>

    <div>

        <input type="text"
        id="lastName"
        placeholder="Last Name"oninput="this.value = this.value.replace(/[^a-zA-Z]/g,'')"
        class="w-full h-14 px-5 border border-gray-300 rounded-xl outline-none focus:border-purple-500 transition">

        <small id="lastNameError"
        class="text-red-500 text-sm"></small>

    </div>

</div>

<!-- EMAIL -->

<div>

    <input type="email"
    id="email"
    placeholder="Email" oninput="this.value = this.value.replace(/[^a-zA-Z0-9@.]/g,'')"
    class="w-full h-14 px-5 border border-gray-300 rounded-xl outline-none focus:border-purple-500 transition">

    <small id="emailError"
    class="text-red-500 text-sm"></small>

</div>

<!-- PASSWORD -->

<div>

    <input type="password"
    id="password"
    placeholder="Password"
    class="w-full h-14 px-5 border border-gray-300 rounded-xl outline-none focus:border-purple-500 transition">

    <small id="passwordError"
    class="text-red-500 text-sm"></small>

</div>

<!-- CONFIRM PASSWORD -->

<div>

    <input type="password"
    id="confirmPassword"
    placeholder="Confirm Password"
    class="w-full h-14 px-5 border border-gray-300 rounded-xl outline-none focus:border-purple-500 transition">

    <small id="confirmPasswordError"
    class="text-red-500 text-sm"></small>

</div>
                <!-- CHECKBOX -->


                <!-- REGISTER BUTTON -->

                <button type="submit"
                class="w-full h-14 bg-purple-500 text-white rounded-xl font-semibold hover:bg-purple-700 transition duration-300">

                    Register Now

                </button>

            </form>

            <!-- LOGIN OPTION -->

            <p class="text-center text-gray-600 mt-8">

                Already have an account?

                <button onclick="showLogin()"
                class="text-purple-600 font-semibold hover:underline">

                    Login

                </button>

            </p>

        </div>

    </div>

    <!-- JAVASCRIPT -->

    <script>

        function showRegister(){

            document.getElementById("loginSection")
            .classList.add("hidden");

            document.getElementById("registerSection")
            .classList.remove("hidden");

        }

        function showLogin(){

            document.getElementById("registerSection")
            .classList.add("hidden");

            document.getElementById("loginSection")
            .classList.remove("hidden");

        }
        function showSuccess(event){

    event.preventDefault();

    alert("Registration Successful ✅");

}
function validateRegister(event){

    event.preventDefault();

    let firstName =
    document.getElementById("firstName").value.trim();

    let lastName =
    document.getElementById("lastName").value.trim();

    let email =
    document.getElementById("email").value.trim();

    let password =
    document.getElementById("password").value;

    let confirmPassword =
    document.getElementById("confirmPassword").value;

    /* CLEAR ERRORS */

    document.getElementById("firstNameError").innerHTML = "";

    document.getElementById("lastNameError").innerHTML = "";

    document.getElementById("emailError").innerHTML = "";

    document.getElementById("passwordError").innerHTML = "";

    document.getElementById("confirmPasswordError").innerHTML = "";

    let isValid = true;

    /* FIRST NAME */

    if(firstName.length < 3){

        document.getElementById("firstNameError")
        .innerHTML =
        "Minimum 3 characters required";

        isValid = false;

    }

    /* LAST NAME */

    if(lastName.length < 3){

        document.getElementById("lastNameError")
        .innerHTML =
        "Minimum 3 characters required";

        isValid = false;

    }

    /* EMAIL */

    if(!email.endsWith("@gmail.com")){

        document.getElementById("emailError")
        .innerHTML =
        "Email must end with @gmail.com";

        isValid = false;

    }

    /* PASSWORD */

    if(password.length < 8){

        document.getElementById("passwordError")
        .innerHTML =
        "Password must contain minimum 8 characters";

        isValid = false;

    }

    /* CONFIRM PASSWORD */

    if(password !== confirmPassword){

        document.getElementById("confirmPasswordError")
        .innerHTML =
        "Passwords do not match";

        isValid = false;

    }

    /* SUCCESS */

    if(isValid){

        alert("Registration Successful ✅");

    }

}

    </script>

</body>

</html>
